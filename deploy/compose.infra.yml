name: tbmmorpg

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: tbmmorpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbmmorpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tbmmorpg_site}
    volumes:
      - tbmmorpg-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tbmmorpg-network

  redis:
    image: redis/redis-stack-server:7.2.0-v14@sha256:076f9df0f581f2c87dd620f38aeaae9deff9228d612961cf9ca4403c0befa7e1
    container_name: tbmmorpg-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-stack-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - tbmmorpg-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tbmmorpg-network

  mongo:
    image: mongo:8@sha256:0e900a3364da37b76d642b73b0bba56bd4c6c509ab470cf700436fd866bee3ff
    container_name: tbmmorpg-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    command: ["mongod", "--auth", "--quiet"]
    volumes:
      - tbmmorpg-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tbmmorpg-network

  nginx:
    image: ${DOCKER_IMAGE_NGINX:?DOCKER_IMAGE_NGINX is required}
    container_name: tbmmorpg-nginx
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      PLAY_DOMAIN_NAME: ${PLAY_DOMAIN_NAME:?PLAY_DOMAIN_NAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tbmmorpg-certs:/etc/letsencrypt:ro
      - tbmmorpg-certbot-challenge:/var/www/certbot:ro
    networks:
      - tbmmorpg-edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v2.11.0@sha256:ddf9e5d226a56e886986838fa0ebedc0237511c78664352e8d0f4346ee022cd8
    container_name: tbmmorpg-certbot
    profiles:
      - manual
    restart: "no"
    volumes:
      - tbmmorpg-certs:/etc/letsencrypt
      - tbmmorpg-certbot-challenge:/var/www/certbot
    command: ["--help"]
    networks:
      - tbmmorpg-edge

volumes:
  tbmmorpg-postgres-data:
    name: tbmmorpg-postgres-data
  tbmmorpg-redis-data:
    name: tbmmorpg-redis-data
  tbmmorpg-mongo-data:
    name: tbmmorpg-mongo-data
  tbmmorpg-certs:
    name: tbmmorpg-certs
  tbmmorpg-certbot-challenge:
    name: tbmmorpg-certbot-challenge

networks:
  tbmmorpg-network:
    name: tbmmorpg-network
    driver: bridge
  tbmmorpg-edge:
    name: tbmmorpg-edge
    driver: bridge
