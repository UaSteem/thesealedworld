services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: tbmmorpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbmmorpg
      POSTGRES_PASSWORD: tbmmorpg_dev  # pragma: allowlist secret
      POSTGRES_DB: tbmmorpg_site
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tbmmorpg-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbmmorpg -d tbmmorpg_site"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tbmmorpg-postgres-data:
