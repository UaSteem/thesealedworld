name: tbmmorpg

services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:0c875296f85ffd7c0ffaaaeff678cd2f383890050297585318d7cf8f49024d1f
    container_name: tbmmorpg-cloudbeaver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - tbmmorpg-cloudbeaver-workspace:/opt/cloudbeaver/workspace
    networks:
      - tbmmorpg-network

  redisinsight-data-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX,g+rwX /data"]
    volumes:
      - tbmmorpg-redisinsight-data:/data

  redisinsight:
    image: redis/redisinsight:latest@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    container_name: tbmmorpg-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - tbmmorpg-redisinsight-data:/data
    depends_on:
      redisinsight-data-init:
        condition: service_completed_successfully
    networks:
      - tbmmorpg-network

volumes:
  tbmmorpg-cloudbeaver-workspace:
    name: tbmmorpg-cloudbeaver-workspace
  tbmmorpg-redisinsight-data:
    name: tbmmorpg-redisinsight-data

networks:
  tbmmorpg-network:
    name: tbmmorpg-network
    external: true
