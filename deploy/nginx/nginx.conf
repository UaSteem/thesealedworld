user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Native request error records include the full URL and cannot be redacted.
    # Keep master/startup errors above; use structured status/upstream/timing
    # access records for request failures, without credential-bearing URLs.
    error_log /dev/null;

    map $uri $log_route {
        default "<unmatched>";
        / "/";
        ~^/api(?:/|$) "/api/{path}";
        ~^/admin(?:/|$) "/admin/{path}";
        ~^/account(?:/|$) "/account/{path}";
        ~^/surveys?(?:/|$) "/surveys/{path}";
        ~^/ws(?:/|$) "/ws/{path}";
        ~^/chat(?:/|$) "/chat/{path}";
        ~^/static(?:/|$) "/static/{path}";
        ~^/health(?:/|$) "/health/{path}";
    }

    map $request_method $log_method {
        default "OTHER";
        GET GET;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$log_method",'
        '"route":"$log_route",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript text/xml application/xml+rss image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
