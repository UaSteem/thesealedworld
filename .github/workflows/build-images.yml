name: Build Release Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run project quality gate
        env:
          SECRET_KEY: test-secret-key-for-ci-32-bytes # pragma: allowlist secret
          ENVIRONMENT: testing
          DEBUG: "False"
          FRONTEND_INTERNAL_SERVICE_KEY: ci-site-game-synthetic-key-for-tests # pragma: allowlist secret
          SITE_TO_GAME_SERVICE_KEY: ci-site-game-synthetic-key-for-tests # pragma: allowlist secret
          BACKEND_INTERNAL_SERVICE_KEY: ci-site-game-synthetic-key-for-tests # pragma: allowlist secret
        run: uv run --locked python tools/dev/check.py --ci

  build-images:
    name: Build and Push Images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract image metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "VERSION=manual-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Site
        id: image_site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-site:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-site:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-site:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-site:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-site:buildcache,mode=max

      - name: Build and Push Game
        id: image_game
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-game:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-game:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-game:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-game:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-game:buildcache,mode=max

      - name: Build and Push Chat
        id: image_chat
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/chat/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-chat:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-chat:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-chat:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-chat:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-chat:buildcache,mode=max

      - name: Build and Push Worker
        id: image_worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-worker:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-worker:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-worker:buildcache,mode=max

      - name: Build and Push Telegram Bot
        id: image_tg_bot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/tg_bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-tg-bot:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-tg-bot:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-tg-bot:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-tg-bot:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-tg-bot:buildcache,mode=max

      - name: Build and Push Nginx
        id: image_nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-nginx:${{ env.VERSION }}
            ghcr.io/${{ env.REPO_LOWER }}-nginx:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-nginx:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-nginx:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-nginx:buildcache,mode=max

      - name: Record verified image digests
        env:
          DIGEST_SITE: ${{ steps.image_site.outputs.digest }}
          DIGEST_GAME: ${{ steps.image_game.outputs.digest }}
          DIGEST_CHAT: ${{ steps.image_chat.outputs.digest }}
          DIGEST_WORKER: ${{ steps.image_worker.outputs.digest }}
          DIGEST_TG_BOT: ${{ steps.image_tg_bot.outputs.digest }}
          DIGEST_NGINX: ${{ steps.image_nginx.outputs.digest }}
        run: python3 -I tools/deploy/verified_images.py manifest --run-id "$GITHUB_RUN_ID" --output release-images.json

      - name: Publish verified image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images-${{ github.run_attempt }}
          path: release-images.json
          if-no-files-found: error
          retention-days: 90
