name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to deploy"
        required: true
        type: choice
        options:
          - infra
          - site
          - game
          - tg-bot
          - full
      image_ref:
        description: "Release version or full commit SHA from the selected successful build"
        required: true
        type: string

      build_run_id:
        description: "Successful Build Release Images run ID (must include image manifest)"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-images:
    name: Verify successful image build
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
      image_site: ${{ steps.verify.outputs.image_site }}
      image_game: ${{ steps.verify.outputs.image_game }}
      image_chat: ${{ steps.verify.outputs.image_chat }}
      image_worker: ${{ steps.verify.outputs.image_worker }}
      image_tg_bot: ${{ steps.verify.outputs.image_tg_bot }}
      image_nginx: ${{ steps.verify.outputs.image_nginx }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify build and immutable image manifest
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: python3 -I tools/deploy/verified_images.py verify --run-id "$BUILD_RUN_ID" --image-ref "$IMAGE_REF" --output "$GITHUB_OUTPUT"

  preflight:
    name: Check Server Availability
    needs: verify-images
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: echo "SSH connection successful"

  deploy:
    name: Deploy ${{ inputs.layer }}
    needs: [verify-images, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-images.outputs.head_sha }}

      - name: Copy deploy configs to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/"
          target: "/opt/turnbasedmmorpg/"
          strip_components: 0
          rm: false
          overwrite: true

      - name: SSH Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_LAYER: ${{ inputs.layer }}
          IMAGE_SITE: ${{ needs.verify-images.outputs.image_site }}
          IMAGE_GAME: ${{ needs.verify-images.outputs.image_game }}
          IMAGE_CHAT: ${{ needs.verify-images.outputs.image_chat }}
          IMAGE_WORKER: ${{ needs.verify-images.outputs.image_worker }}
          IMAGE_TG_BOT: ${{ needs.verify-images.outputs.image_tg_bot }}
          IMAGE_NGINX: ${{ needs.verify-images.outputs.image_nginx }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_LAYER,IMAGE_SITE,IMAGE_GAME,IMAGE_CHAT,IMAGE_WORKER,IMAGE_TG_BOT,IMAGE_NGINX,GITHUB_ACTOR,GITHUB_TOKEN,ENV_FILE_CONTENT
          script: |
            set -euo pipefail

            cd /opt/turnbasedmmorpg/deploy

            # Create privately, update off to the side, then replace atomically.
            # umask alone cannot fix the mode of an already-existing .env.
            umask 077
            env_tmp=$(mktemp .env.tmp.XXXXXX)
            trap 'rm -f -- "$env_tmp"' EXIT
            printf '%s\n' "$ENV_FILE_CONTENT" > "$env_tmp"

            update_var() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$env_tmp"; then
                sed -i "s|^${key}=.*|${key}=${value}|g" "$env_tmp"
              else
                printf '%s=%s\n' "$key" "$value" >> "$env_tmp"
              fi
            }

            update_var "DOCKER_IMAGE_SITE" "${IMAGE_SITE}"
            update_var "DOCKER_IMAGE_GAME" "${IMAGE_GAME}"
            update_var "DOCKER_IMAGE_CHAT" "${IMAGE_CHAT}"
            update_var "DOCKER_IMAGE_WORKER" "${IMAGE_WORKER}"
            update_var "DOCKER_IMAGE_TG_BOT" "${IMAGE_TG_BOT}"
            update_var "DOCKER_IMAGE_NGINX" "${IMAGE_NGINX}"

            chmod 600 "$env_tmp"
            mv -fT -- "$env_tmp" .env
            trap - EXIT

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            deploy_compose() {
              compose_file="$1"
              docker compose -f "$compose_file" pull
              docker compose -f "$compose_file" up -d --wait --wait-timeout 120
              docker compose -f "$compose_file" ps
            }

            case "$DEPLOY_LAYER" in
              infra)
                deploy_compose compose.infra.yml
                ;;
              site)
                deploy_compose compose.site.yml
                ;;
              game)
                deploy_compose compose.game.yml
                ;;
              tg-bot)
                deploy_compose compose.tg-bot.yml
                ;;
              full)
                deploy_compose compose.infra.yml
                deploy_compose compose.site.yml
                deploy_compose compose.game.yml
                deploy_compose compose.tg-bot.yml
                ;;
              *)
                echo "Unknown deploy layer: $DEPLOY_LAYER" >&2
                exit 1
                ;;
            esac

            docker image prune -f
