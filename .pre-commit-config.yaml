exclude: ^temp/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(assets/monster_defaults/|src/frontend/static/images/monsters/catalog/)
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^archive/
      - id: ruff-format
        # Prepared payloads are literal authoring output with byte hashes in manifests.
        exclude: ^(archive/|src/backend/features/monsters/catalog/(equipment_library/prepared/|families/[^/]+/equipment/prepared/))

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # Retained source archives are historical data, not executable application code.
        exclude: ^archive/
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # 1. Проверка библиотек на уязвимости (CVE)
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (project .venv)
        language: system
        entry: python -I tools/dev/pip_audit_project.py
        pass_filenames: false
        always_run: true
        args:
          - "--local"
          - "--timeout"
          - "15"
          - "--ignore-vuln"
          - "CVE-2026-3219"  # pip 26.0.1 vulnerability with no fix available yet
          - "--ignore-vuln"
          - "CVE-2026-6357"  # New pip vulnerability
          - "--ignore-vuln"
          - "PYSEC-2026-196"  # pip vulnerability pending environment upgrade
          - "--ignore-vuln"
          - "PYSEC-2025-183"  # PyJWT advisory with no fix available yet
          - "--ignore-vuln"
          - "PYSEC-2026-89"  # Markdown advisory with no fix available yet
          - "--ignore-vuln"
          - "CVE-2026-34993"  # aiohttp held by aiogram <3.14 constraint
          - "--ignore-vuln"
          - "CVE-2026-47265"  # aiohttp held by aiogram <3.14 constraint

  # 2. Поиск "забытых" секретов и паролей (усиленный)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(src/lily_backend/system/fixtures/catalog/|src/backend/alembic/|src/frontend/static/js/vendor/phaser\.min\.js$)

  # 3. Листинг и проверка Docker-файлов (Linter)
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles (Docker)
        language: python
        entry: python tools/dev/hadolint_docker.py
        files: ^deploy/.*/Dockerfile(\.local)?$

  # 4. Линтер и форматировщик HTML/Jinja2 шаблонов
  - repo: https://github.com/djlint/djlint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-jinja
      - id: djlint-jinja
