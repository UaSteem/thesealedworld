<section id="chat" class="chat" aria-label="Сообщения и журнал боя">
  <header class="chat-heading">
    <div class="chat-tabs" role="group" aria-label="Вкладки сообщений">
      <button type="button" class="is-active" data-chat="world" aria-pressed="true">Мир</button>
      <button type="button" data-chat="local" aria-pressed="false">Локация</button>
      <button type="button" data-chat="party" aria-pressed="false">Группа</button>
      <button type="button" data-chat="trade" aria-pressed="false">Торговля</button>
      <button type="button" data-chat="system" aria-pressed="false">Система</button>
      <button type="button" id="combat-log-tab" aria-pressed="false" hidden>Бой</button>
    </div>
    <span class="chat-mock-label">Локальный макет</span><button id="chat-reset" type="button">Сбросить размер</button>
    <button id="chat-toggle" type="button" aria-expanded="true" aria-controls="chat-content">Свернуть ⌄</button>
  </header>
  <div id="chat-content" class="chat-content">
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
    <div id="combat-log" class="chat-messages combat-log" role="log" aria-label="Моковый журнал текущего боя" aria-live="polite" hidden></div>
    <form id="chat-form"><label class="sr-only" for="chat-input">Тестовое сообщение, только в этой вкладке</label><input id="chat-input" autocomplete="off" maxlength="300" placeholder="Локальное сообщение…"><button type="submit" aria-label="Добавить тестовое сообщение">↵</button></form>
  </div>
</section>
