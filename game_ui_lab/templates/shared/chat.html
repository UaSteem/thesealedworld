<section id="chat" class="chat" aria-label="Локальный макет чата">
            <header class="chat-heading"><div class="chat-tabs" role="group" aria-label="Каналы макета"><button type="button" class="is-active" data-chat="world" aria-pressed="true">Мир</button><button type="button" data-chat="local" aria-pressed="false">Рядом</button><button type="button" data-chat="system" aria-pressed="false">Система</button></div><span class="chat-mock-label">Локальный макет</span><button id="chat-reset" type="button">Сбросить размер</button><button id="chat-toggle" type="button" aria-expanded="true" aria-controls="chat-content">Свернуть ⌄</button></header>
            <div id="chat-content" class="chat-content"><div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div><form id="chat-form"><label class="sr-only" for="chat-input">Тестовое сообщение, только в этой вкладке</label><input id="chat-input" autocomplete="off" maxlength="300" placeholder="Локальное сообщение…"><button type="submit" aria-label="Добавить тестовое сообщение">↵</button></form></div>
          </section>
