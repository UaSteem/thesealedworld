<!doctype html>
<html lang="ru" data-game-theme="adventure">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>Интерфейс · лаборатория Sealed World</title>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/ui-static/game/shell/obsidian-bronze.css">
  <link rel="stylesheet" href="/ui-static/game/shell/shell.css">
  <link rel="stylesheet" href="/ui-static/game/shell/character.css">
  <link rel="stylesheet" href="/ui-static/game/scenes/inventory/inventory.css">
  <link rel="stylesheet" href="/ui-static/game/shell/workspace.css">
  <script defer src="/ui-static/game/shell/viewport.js"></script>
  <script defer src="/static/js/vendor/phaser.min.js"></script>
  <script defer src="/ui-static/game/core/assets.js"></script>
  {% for script in scene_scripts %}
  <script defer src="/ui-static/{{ script }}"></script>
  {% endfor %}
  <script defer src="/ui-static/game/shared/rift-renderer/terrain-pointy.js"></script>
  <script defer src="/ui-static/game/shared/rift-renderer/metadata.js"></script>
  <script defer src="/ui-static/game/shared/rift-renderer/flower-terrain.js"></script>
  <script defer src="/ui-static/game/scenes/rift-preview.js"></script>
  <script defer src="/ui-static/game/core/boot.js"></script>
  <script defer src="/ui-static/game/shell/overlay-chat.js"></script>
  <script defer src="/ui-static/game/shell/chat.js"></script>
</head>
<body class="game-lab-workspace" data-game-screen="rift">
  <div class="game-viewport" id="game-viewport">
  <main class="workspace">
    <section class="game-frame" aria-label="Прототип игрового интерфейса">
      <div class="play-column">
        <header class="lab-debug-header">
          <div id="lab-debug"><strong>Debug</strong>
            <nav aria-label="Страницы лаборатории">
              <button data-lab-screen="rift">Карта рифта</button>
              <button data-lab-screen="combat">Бой</button>
              <button data-lab-screen="character">Персонаж</button>
              <button data-character-tab="Квесты">Квесты</button>
              <button data-character-tab="Настройки">Настройки</button>
              <button data-lab-screen="scenario">Диалоги</button>
              <button data-lab-screen="arena">Арена</button>
              <button data-lab-screen="districts">Кварталы</button>
              <button data-lab-screen="city">Город</button>
              <button data-lab-screen="loot">Добыча</button>
              <button data-lab-screen="death">Смерть</button>
            </nav>
            <div id="combat-view-options" class="projection-switch" hidden><label><input id="show-hex-grid" type="checkbox">Сетка</label><label><input id="show-hex-numbers" type="checkbox">Номера гексов</label></div>
          </div>
          <span id="game-screen-title">Карта рифта</span>
          <button id="inventory-close" type="button" aria-label="Вернуться к сцене" hidden>Назад</button>
        </header>
        <div id="scene-split" class="scene-split">
          <section class="stage-shell" aria-label="Игровая область">
            <div id="combat-stage" data-game-scene="rift"></div>
            <details class="rift-debug-window"><summary>Debug · зум</summary>
              <div><label for="rift-min-zoom">Предел отдаления · минимальный масштаб</label>
                <input id="rift-min-zoom" type="range" min="0.01" max="2" step="0.01" value="1">
                <output id="rift-min-zoom-value" for="rift-min-zoom">1.00×</output>
                <label class="rift-zoom-unlock"><input id="rift-unlock-zoom-out" type="checkbox"> Убрать ограничение отдаления</label>
                <span>Текущий масштаб</span><output id="rift-current-zoom">—</output>
                <small>Меньше число — дальше обзор. Текущий принятый масштаб — 1.00×.</small>
              </div>
            </details>
            {% include "shared/player-hud.html" %}
            {% include "shared/character-window.html" %}
            {% include "shared/chat.html" %}
          </section>

        </div>
      </div>
    </section>
  </main>
  </div>
  <script id="page-briefs" type="application/json">{{ page_briefs | tojson }}</script>
  <script id="character-data" type="application/json">{{ character | tojson }}</script>
  <script id="inventory-data" type="application/json">{{ inventory | tojson }}</script>
</body>
</html>
